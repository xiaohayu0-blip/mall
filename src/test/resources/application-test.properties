# 集成测试专用配置 — 替换所有外部依赖为内存实现
spring.datasource.url=jdbc:h2:mem:mall_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# 禁用 Flyway（H2 自动建表）
spring.flyway.enabled=false

# 禁用 RabbitMQ 和响应式 Redis 自动配置
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration

# ES 指向不存在的地址，触发降级逻辑
spring.elasticsearch.uris=http://localhost:19200

jwt.token.secretKey=test_secret_key
