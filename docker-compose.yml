services:

  redis:
    image: redis:7-alpine
    container_name: mall-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mall-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mall-app
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://host.docker.internal:3306/mall?characterEncoding=utf-8
      DB_USERNAME: ${DB_USERNAME:-root}
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./mall-frontend
      dockerfile: Dockerfile
    container_name: mall-frontend
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  redis_data:
  rabbitmq_data:
