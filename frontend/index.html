<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mall Console</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-login" class="login-screen">
        <div class="login-box">
            <h1 class="login-logo">Mall Console</h1>
            <p class="login-sub">商家管理后台</p>
            <form id="auth-form">
                <div class="form-group">
                    <input type="text" id="form-username" placeholder="用户名" required>
                </div>
                <div class="form-group">
                    <input type="password" id="form-password" placeholder="密码" required>
                </div>
                <button type="submit" class="btn-primary" id="form-submit">登录</button>
                <p class="form-switch">
                    <span>没有账号？</span>
                    <a href="#" id="switch-link">注册</a>
                </p>
            </form>
        </div>
    </div>

    <div id="app-main" class="app-main hidden">
        <aside class="sidebar">
            <div class="sidebar-logo">Mall</div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="products">商品管理</a>
                <a href="#" class="nav-item" data-view="tags">标签管理</a>
                <a href="#" class="nav-item" data-view="bind">绑定标签</a>
            </nav>
            <div class="sidebar-footer">
                <span id="user-name"></span>
                <button id="logout-btn" class="btn-logout">退出</button>
            </div>
        </aside>
<!-- CONTENT_CONTINUES -->
        <div class="content">
            <section id="view-products" class="view active">
                <div class="view-header">
                    <h1 class="view-title">商品管理</h1>
                    <button class="btn-action" id="btn-add-product">+ 添加商品</button>
                </div>
                <div class="toolbar">
                    <input type="text" id="search-input" class="search-input" placeholder="搜索商品名称...">
                    <select id="filter-category" class="select-sm"><option value="">全部分类</option></select>
                </div>
                <div id="products-table" class="table-wrap"></div>
                <div id="pagination" class="pagination"></div>
            </section>

            <section id="view-tags" class="view">
                <div class="view-header">
                    <h1 class="view-title">标签管理</h1>
                </div>
                <div class="tags-layout">
                    <div class="tags-col">
                        <div class="card">
                            <h3 class="card-title">新建标签组</h3>
                            <form id="tag-group-form" class="inline-form">
                                <input type="text" id="tg-name" placeholder="标签组名称" required>
                                <button type="submit" class="btn-action">创建</button>
                            </form>
                        </div>
                        <div class="card">
                            <h3 class="card-title">新建标签</h3>
                            <form id="tag-form" class="inline-form-col">
                                <select id="t-group" required></select>
                                <input type="text" id="t-name" placeholder="标签名称" required>
                                <button type="submit" class="btn-action">创建</button>
                            </form>
                        </div>
                    </div>
                    <div class="tags-col tags-col-wide">
                        <div class="card">
                            <h3 class="card-title">全部标签</h3>
                            <div id="tags-overview"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="view-bind" class="view">
                <div class="view-header">
                    <h1 class="view-title">商品绑定标签</h1>
                </div>
                <div class="card" style="max-width:600px">
                    <form id="bind-form">
                        <div class="form-group">
                            <label class="form-label">选择商品</label>
                            <select id="b-commodity" required></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">选择标签</label>
                            <div id="b-tags" class="chip-select"></div>
                        </div>
                        <button type="submit" class="btn-primary">确认绑定</button>
                    </form>
                    <div id="bind-result"></div>
                </div>
            </section>
        </div>

        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modal-title">添加商品</h2>
                    <button class="modal-close" id="modal-close">&times;</button>
                </div>
                <form id="product-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">商品名称</label>
                            <input type="text" id="p-name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">价格</label>
                            <input type="text" id="p-price" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">分类</label>
                            <select id="p-category"></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">库存</label>
                            <input type="number" id="p-stock" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">描述</label>
                        <textarea id="p-desc" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">提交</button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
